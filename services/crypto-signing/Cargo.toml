[package]
name = "crypto-signing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crypto-signing"
path = "src/main.rs"

[dependencies]
tokio      = { version = "1.40", features = ["full"] }
redis      = { version = "0.27", features = ["tokio-comp", "streams"] }
anyhow     = "1.0"
thiserror  = "1.0"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1.10", features = ["v4"] }
sha2       = "0.10"
hex        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
tempfile   = "3.13"

# Pure-Rust crypto — no Perl/OpenSSL needed on Windows
# rcgen generates X.509 certs; ring handles RSA/ECDSA signing
rcgen      = "0.13"
ring       = "0.17"
p12        = "0.6"
pem        = "3.0"

# QR code generation for tamper-evident manifest
qrcode     = "0.14"
image      = { version = "0.25", default-features = false, features = ["png"] }

# S3 artifact storage
aws-sdk-s3 = "1.54"
aws-config = "1.5"

# AWS KMS — Phase 3 key operations
aws-sdk-kms = "1.40"

# Postgres
tokio-postgres = { version = "0.7", features = [] }

[dev-dependencies]
tokio-test = "0.4"
