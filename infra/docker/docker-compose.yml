version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# DocEngine — Local Development Stack
#
# Full pipeline:
#   api-gateway  →  ingestion-engine  →  Redis Streams
#   Redis Streams →  render-typst / render-chromium
#   render output →  crypto-signing  →  artifact-storage (webhooks)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  docengine:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

x-common-env: &common-env
  REDIS_URL:    redis://redis:6379
  DATABASE_URL: postgres://docengine:devpassword@postgres:5432/docengine
  ARTIFACT_BUCKET: docengine-artifacts
  S3_ENDPOINT:  http://minio:9000
  AWS_ACCESS_KEY_ID:     minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION:   ap-south-1

services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       docengine
      POSTGRES_USER:     docengine
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [docengine]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [docengine]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks: [docengine]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the artifact bucket on first boot — one-shot container
  minio-init:
    image: minio/mc:latest
    restart: on-failure
    depends_on:
      minio: { condition: service_healthy }
    networks: [docengine]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/docengine-artifacts &&
        mc anonymous set none local/docengine-artifacts &&
        echo 'bucket ready'
      "

  # ── Application Services ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT:           "3000"
      UPSTREAM_URL:   http://ingestion-engine:8080
      JWT_SECRET:     dev-jwt-secret-change-in-production
      RATE_LIMIT_MAX: "200"
      RATE_LIMIT_WINDOW_MS: "60000"
      LOG_LEVEL:      debug
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      ingestion-engine:
        condition: service_started
    networks: [docengine]

  ingestion-engine:
    build:
      context: ../../services/ingestion-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      GIN_MODE: debug
      PORT:     "8080"
    ports:
      - "8080:8080"   # exposed for direct testing; in prod only api-gateway touches this
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [docengine]

  render-typst:
    build:
      context: ../../services/render-worker-typst
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      CONSUMER_GROUP:     typst-workers
      WORKER_CONCURRENCY: "4"
      TEMPLATE_DIR:       /templates/typst
      RUST_LOG:           info
    volumes:
      - ../../templates/typst:/templates/typst:ro
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [docengine]
    mem_limit: 400m
    memswap_limit: 400m

  render-chromium:
    build:
      context: ../../services/render-worker-chromium
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      CONSUMER_GROUP:      chromium-workers
      WORKER_CONCURRENCY:  "2"
      MAX_JOBS_PER_WORKER: "50"
      MAX_RSS_MB:          "250"
      TEMPLATE_DIR:        /templates/html
      LOG_LEVEL:           info
    volumes:
      - ../../templates/html:/templates/html:ro
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [docengine]
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - seccomp:unconfined
    shm_size: 256m

  crypto-signing:
    build:
      context: ../../services/crypto-signing
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      CONSUMER_GROUP:     signing-workers
      SIGNING_KEY_SOURCE: pem
      SIGNING_CERT_PATH:  /certs/signing.crt
      SIGNING_KEY_PATH:   /certs/signing.key
      RUST_LOG:           info
    volumes:
      - ../../dev-certs:/certs:ro
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [docengine]

  artifact-storage:
    build:
      context: ../../services/artifact-storage
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      CONSUMER_GROUP:  notification-workers
      PRESIGN_TTL_SEC: "3600"
      LOG_LEVEL:       info
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [docengine]
