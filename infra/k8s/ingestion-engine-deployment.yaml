apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-engine
  namespace: docengine
  labels:
    app: ingestion-engine
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-engine
  template:
    metadata:
      labels:
        app: ingestion-engine
        tier: api
    spec:
      serviceAccountName: docengine-api
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingestion-engine
          image: yourorg/ingestion-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: docengine-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docengine-secrets
                  key: database-url
            - name: GIN_MODE
              value: release
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-engine
  namespace: docengine
spec:
  selector:
    app: ingestion-engine
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-engine-hpa
  namespace: docengine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
